<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Solicitação recebida — Art Pel Embalagens</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo.png">

<!-- ============ TRACKING ============ -->
<!-- Meta Pixel — 2a camada Lead + CompleteRegistration com Advanced Matching -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
var META_PIXEL_ID='1010593818107155';
</script>
<!-- Google tag (gtag.js) - Google Ads + GA4 (GA4 ainda como placeholder) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18498510154"></script>
<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'AW-18498510154');
var GA4_ID='G-XXXXXXXXXX';
</script>

<style>
:root{
  --brand:#9A7B54;--brand-dark:#7A5F3E;--brand-light:#D4B896;
  --ink:#2A2119;--ink-soft:#5A4D3E;--bg:#FFFFFF;--cream:#F5F4F1;
  --night:#141924;--wa:#25D366;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.card{background:#fff;max-width:560px;width:100%;padding:48px 44px;border-radius:12px;box-shadow:0 10px 40px rgba(20,15,10,0.08);text-align:center}
.icon-check{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#34C759,#2AA84B);display:inline-flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 6px 24px rgba(52,199,89,0.35)}
.icon-check svg{width:36px;height:36px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-0.015em;margin-bottom:14px;text-wrap:balance}
p{font-size:15.5px;line-height:1.6;color:var(--ink-soft);margin-bottom:8px}
.hi{font-weight:600;color:var(--ink)}
.actions{margin-top:32px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:5px;font-weight:600;font-size:15px;transition:transform .12s,background .2s;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn--wa{background:var(--wa);color:#fff}
.btn--wa:hover{background:#1EBE5D}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--cream-line,#E7E5E1)}
.btn--ghost:hover{border-color:var(--brand);color:var(--brand)}
.logo{margin-bottom:32px;display:inline-block}
.logo img{height:96px;width:auto;object-fit:contain}
.foot{font-size:12.5px;color:var(--ink-soft);margin-top:32px}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo"><img src="assets/logo.png" alt="Art Pel Embalagens"></a>
  <div class="icon-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
  <h1>Solicitação recebida!</h1>
  <p id="hi" class="hi"></p>
  <p>Nossa equipe comercial vai analisar sua operação e entrar em contato pelo WhatsApp em breve com uma proposta sob medida para o seu volume.</p>

  <div class="actions">
    <a href="#" id="waCta" class="btn btn--wa">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg>
      Adiantar contato pelo WhatsApp
    </a>
    <a href="/" class="btn btn--ghost">Voltar para o site</a>
  </div>

  <p class="foot">São José / SC — Produção própria há mais de 26 anos.</p>
</div>

<script>
(function(){
  // TODO: substituir pelo WhatsApp comercial real da Art Pel
  const WHATSAPP='5548988244798';

  let lead={};
  try{lead=JSON.parse(sessionStorage.getItem('_artpel_lead')||'{}');}catch(e){}

  // Cumprimento personalizado
  const hi=document.getElementById('hi');
  if(lead.nome){
    const primeiroNome=lead.nome.split(/\s+/)[0];
    hi.textContent=`Obrigado, ${primeiroNome}!`;
  }else{hi.textContent='Obrigado pelo interesse!';}

  // WhatsApp CTA
  const wa=document.getElementById('waCta');
  const msg=`Olá! Preenchi o formulário no site da Art Pel Embalagens e gostaria de agilizar o contato.${lead.nome?'\n\n*Nome:* '+lead.nome:''}${lead.empresa?'\n*Empresa:* '+lead.empresa:''}${lead.cidade?'\n*Cidade:* '+lead.cidade:''}`;
  wa.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;

  // Meta Pixel: Lead (2a camada dedup pelo eventID) + CompleteRegistration
  if(META_PIXEL_ID!=='PIXEL_ID'&&window.fbq){
    try{
      // Advanced Matching
      const am={};
      if(lead.email){am.em=lead.email.toLowerCase().trim()}
      if(lead.whatsapp){am.ph='55'+String(lead.whatsapp).replace(/\D/g,'').replace(/^55/,'')}
      if(lead.nome){const parts=lead.nome.trim().split(/\s+/);am.fn=parts[0].toLowerCase();am.ln=(parts.slice(1).join(' ')||'').toLowerCase()}
      if(lead.cidade){const cp=lead.cidade.split(/[\/,-]/).map(s=>s.trim());if(cp[0])am.ct=cp[0].toLowerCase().replace(/\s/g,'');if(cp[1])am.st=cp[1].toLowerCase().replace(/\s/g,'')}
      am.country='br';
      fbq('init',META_PIXEL_ID,am);
      fbq('track','PageView');
      fbq('track','Lead',{content_name:'LP Industrial Art Pel',content_category:'Embalagens Industriais',currency:'BRL',value:100.00},lead.eventID?{eventID:lead.eventID}:{});
      fbq('track','CompleteRegistration',{content_name:'Art Pel LP Industrial',status:'qualificado'});
    }catch(e){console.error('[pixel]',e)}
  }

  // GA4 conversion
  if(GA4_ID!=='G-XXXXXXXXXX'&&window.gtag){
    try{gtag('event','generate_lead',{currency:'BRL',value:100.00,event_category:'form',event_label:'LP Lojas'})}catch(e){}
  }

  // Google Ads conversion — Enviar formulario de lead
  if(window.gtag){
    try{gtag('event','conversion',{'send_to':'AW-18498510154/wvSjCKyQ15UdEMq64_RE','value':1.0,'currency':'BRL'})}catch(e){}
  }

  // Auto-abre WhatsApp em 2s (opcional — descomente pra ativar)
  // setTimeout(()=>{ wa.click(); }, 2000);
})();
</script>
</body>
</html>
